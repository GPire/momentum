# Separate service and database: never reuse the telemetry binding.
# Copy to a deployment-specific config and fill real values before deployment.
name = "momentum-company"
main = "worker.js"
compatibility_date = "2026-09-13"
workers_dev = false

[vars]
ACCESS_ISSUER = "https://YOUR-TEAM.cloudflareaccess.com"
ACCESS_AUD = "REPLACE-WITH-ACCESS-APPLICATION-AUDIENCE"
APP_ORIGIN = "https://REPLACE-WITH-APP-HOST"

[[d1_databases]]
binding = "COMPANY_DB"
database_name = "momentum-company"
database_id = "REPLACE-WITH-D1-ID"

# Private object storage for detached receipts. Create/configure before enabling.
# [[r2_buckets]]
# binding = "COMPANY_FILES"
# bucket_name = "REPLACE-WITH-PRIVATE-COMPANY-BUCKET"
